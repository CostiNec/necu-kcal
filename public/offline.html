<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#00A76F">
        <title>NecuTrack · Offline</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 24px;
                color: #1c252e;
                background: #f9fafb;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            main {
                width: min(100%, 420px);
                padding: 32px;
                text-align: center;
                background: #fff;
                border: 1px solid #dfe3e8;
                border-radius: 16px;
            }

            img {
                width: 72px;
                height: 72px;
            }

            h1 {
                margin: 20px 0 8px;
                font-size: 24px;
            }

            p {
                margin: 0;
                color: #637381;
                line-height: 1.6;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icons/icon-any-192-v2.png" alt="">
            <h1>You’re offline</h1>
            <p>Reconnect to the internet, then reopen NecuTrack.</p>
        </main>
    </body>
</html>
