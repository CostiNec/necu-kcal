services:
  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    command:
      - --data-dir=/data
      - --api-key=${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY}
      - --enable-cors=false
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - typesense-data:/data
    mem_limit: ${TYPESENSE_MEMORY_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8108/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  typesense-data:
